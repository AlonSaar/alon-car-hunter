name: Toyota XLE inventory scan - three times daily
on:
  workflow_dispatch:
  schedule:
    # UTC hours cover 08:00, 14:00, 20:00 America/New_York in EST and EDT.
    - cron: '0 0,1,12,13,18,19 * * *'
permissions:
  contents: write
concurrency:
  group: toyota-inventory-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: New York time gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(TZ=America/New_York date +%H)
            if [ "$HOUR" = "08" ] || [ "$HOUR" = "14" ] || [ "$HOUR" = "20" ]; then
              echo "run_scan=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_scan=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run_scan == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run_scan == 'true'
        with:
          node-version: '24'
      - name: Scan verified direct Toyota listings
        if: steps.gate.outputs.run_scan == 'true'
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: node scripts/scan.mjs
      - name: Publish listing data
        if: steps.gate.outputs.run_scan == 'true'
        run: |
          git config user.name "car-hunter-bot"
          git config user.email "car-hunter-bot@users.noreply.github.com"
          git add data/listings.json data/scan-meta.json
          git diff --cached --quiet || git commit -m "Update Toyota XLE inventory"
          git push
