name: Vehicle scan - 8 AM and 8 PM ET

on:
  schedule:
    # GitHub cron uses UTC. These four trigger times cover both EDT and EST.
    # A New York time gate below allows the scan only at 08:00 or 20:00 local time.
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check New York scan time
        id: timegate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HOUR=$(TZ=America/New_York date +%H)
          if [ "$HOUR" = "08" ] || [ "$HOUR" = "20" ]; then
            echo "run_scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_scan=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.timegate.outputs.run_scan == 'true'

      - uses: actions/setup-node@v4
        if: steps.timegate.outputs.run_scan == 'true'
        with:
          node-version: '24'

      - name: Scan listings
        if: steps.timegate.outputs.run_scan == 'true'
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: node scripts/scan.mjs

      - name: Commit updated listings
        if: steps.timegate.outputs.run_scan == 'true'
        run: |
          git config user.name "car-hunter-bot"
          git config user.email "car-hunter-bot@users.noreply.github.com"
          git add data/listings.json data/scan-meta.json
          git diff --cached --quiet || git commit -m "Vehicle scan - 8 AM / 8 PM ET"
          git push
